<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Notas</title>
</head>
<body>
    <h1>Mis Notas</h1>
    <p>Bienvenido/a, {{ nombre_usuario }}.</p>
    <form method="post" action="{% url 'estudiantes:logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>Asignatura</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody>
            {% for nota in notas %}
                <tr>
                    <td>{{ nota.materia }}</td>
                    <td>{{ nota.nota }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
