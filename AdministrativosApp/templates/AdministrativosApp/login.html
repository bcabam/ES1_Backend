{% extends "base.html" %}

{% block titulo %}Iniciar sesión - Colegio Digital{% endblock %}
{% block encabezado %}Iniciar sesión administrativa{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="correo" class="form-label">Correo institucional</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="administrativos@colegiodigital.cl" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
