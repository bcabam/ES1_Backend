{% extends "base.html" %}

{% block titulo %}Registro - Colegio Digital{% endblock %}
{% block encabezado %}Crear cuenta{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo institucional</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@colegiodigital.cl" required>
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
            </div>
            <div class="mb-3">
                <label for="confirmar_contrasena" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmar_contrasena" name="confirmar_contrasena" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
            <p class="text-center mt-3 mb-0">
                ¿Ya tienes cuenta?
                <a href="{% url 'administrativos:login' %}">Inicia sesión aquí</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
