# Sitio de Apache: sirve los archivos estáticos y subidos, deja phpMyAdmin en
# /phpmyadmin y envía todo lo demás a Django (Gunicorn en el puerto 8000).
# Se copia a /etc/apache2/sites-available/colegio.conf

<VirtualHost *:80>
    # Archivos estáticos (CSS, JS, imágenes del proyecto) reunidos por collectstatic.
    Alias /static/ /home/ubuntu/ES1_Backend/staticfiles/
    <Directory /home/ubuntu/ES1_Backend/staticfiles>
        Require all granted
    </Directory>

    # Archivos subidos por los usuarios (fotos y contratos PDF).
    Alias /media/ /home/ubuntu/ES1_Backend/media/
    <Directory /home/ubuntu/ES1_Backend/media>
        Require all granted
    </Directory>

    # Estas rutas NO se envían a Django.
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass /phpmyadmin !

    # Todo lo demás lo responde Django.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/colegio_error.log
    CustomLog ${APACHE_LOG_DIR}/colegio_access.log combined
</VirtualHost>
