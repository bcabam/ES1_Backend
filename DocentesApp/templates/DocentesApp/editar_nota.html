{% extends 'base.html' %}

{% block title %}Editar nota{% endblock %}

{% block contenido %}
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-white py-3"><h1 class="h4 mb-0">Editar nota</h1></div>
          <div class="card-body p-4">
            <form method="post">
              {% csrf_token %}
              {{ formulario.as_p }}
              <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
                <a class="btn btn-outline-secondary" href="{% url 'notas_docentes' %}">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
