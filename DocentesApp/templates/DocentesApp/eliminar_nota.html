{% extends 'base.html' %}

{% block title %}Eliminar nota{% endblock %}

{% block contenido %}
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow-sm border-danger">
          <div class="card-body p-4">
            <h1 class="h4">Confirmar eliminación</h1>
            <p>¿Eliminar la nota de {{ nota.estudiante.nombre }} en {{ nota.asignatura }} ({{ nota.calificacion }})?</p>
            <form method="post">
              {% csrf_token %}
              <button class="btn btn-danger" type="submit">Eliminar nota</button>
              <a class="btn btn-outline-secondary" href="{% url 'notas_docentes' %}">Cancelar</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
